---
data:
  - type: rule_chain
    attributes:
      protocol: sftp
      source_endpoint: <SFTP_PROXY_SOURCE_ENDPOINT>
      destination_override_endpoint: <UPSTREAM_SANDBOX_SFTP_ENDPOINT>
      host_endpoint: <SFTP_PROXY_HOST_ENDPOINT>
      port: <UPSTREAM_SANDBOX_SFTP_PORT>
      tags:
        name: <ROUTE_NAME>
        source: agentic-onboarding
      entries:
        - phase: <FILTER_PHASE>
          operation: <REDACT_OR_REVEAL>
          token_manager: <STORAGE_MODE>
          public_token_generator: <ALIAS_FORMAT>
          transformer: <FILE_TRANSFORMER>
          transformer_config:
            - <SENSITIVE_FIELD_SELECTOR>
          targets: []
          classifiers: {}
          config:
            condition: AND
            rules:
              - expression:
                  field: filePath
                  type: string
                  operator: matches
                  values:
                    - <FILE_PATH_REGEX>
version: 1
